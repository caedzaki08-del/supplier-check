<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1456d9">
<title>KLIKI Supplier Check</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --blue:#1456d9; --blue-d:#0f43aa; --navy:#0b1f4b; --yellow:#ffc41f;
  --bg:#eef3fb; --card:#fff; --line:#d9e2f2; --ink:#14233f; --muted:#5b6b8a;
  --ok:#0e8a4f; --ok-bg:#e3f6ec; --bad:#c62828; --bad-bg:#fde8e8; --warn:#9a6700; --warn-bg:#fff4d6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{background:var(--blue);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 0 14px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:19px;letter-spacing:.2px}
header small{display:block;opacity:.85;font-size:12px;margin-top:1px}
.pill{font-size:11.5px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap}
.pill.live{background:var(--yellow);color:var(--navy);font-weight:700}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
label.l{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
select,input[type=text],input[type=password],input[type=url],input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:0}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--blue);color:#fff;text-decoration:none}
.btn.sec{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.ghost{background:#eef3fb;color:var(--navy)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.wa{background:#1fa855}
.btn.sm{padding:7px 11px;font-size:13.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1}
.sup{display:flex;gap:11px}
.rk{flex:0 0 32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}
.sup.pick{border:2px solid var(--blue);background:#f4f8ff}
.sup.pick .rk{background:var(--blue)}
.sup.off{opacity:.55}
.sup .nm{font-weight:800;font-size:16px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#eef3fb;color:var(--navy);margin:3px 4px 0 0}
.tag.near{background:var(--ok-bg);color:var(--ok)}
.tag.far{background:var(--bad-bg);color:var(--bad)}
.tag.run{background:var(--warn-bg);color:var(--warn)}
.tag.pickt{background:var(--blue);color:#fff}
.tag.habis{background:var(--bad);color:#fff}
.note{font-size:13.5px;margin-top:6px}
.callout{font-size:13px;border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--ok-bg);color:#0b5c35}
.callout.far{background:var(--bad-bg);color:#8d1c1c}
.callout.warn{background:var(--warn-bg);color:var(--warn)}
.kos{font-weight:800;color:var(--navy)}
.muted{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .wrap{display:flex;padding:0}
nav button{flex:1;border:0;background:none;padding:10px 4px 9px;color:var(--muted);font-weight:700;font-size:12.5px;position:relative}
nav button.on{color:var(--blue)}
nav button .ic{display:block;font-size:19px;line-height:1.1}
.badge{position:absolute;top:5px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;padding:1px 5px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:#eef3fb;width:34px;height:34px;font-size:18px;font-weight:800;color:var(--navy)}
.qty span{min-width:30px;text-align:center;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 15px;border-radius:12px;font-size:14px;z-index:9;max-width:90%;text-align:center}
.sub{display:flex;gap:6px;margin:12px 0}
.sub button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-weight:700;color:var(--muted)}
.sub button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.edrow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.edrow .n{font-weight:800;color:var(--muted)}
.edrow .ctl{display:flex;gap:4px}
.edrow .ctl button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:800}
.edrow input{margin-top:5px;padding:8px 10px;font-size:13.5px}
.edrow .nm{font-weight:700}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div>
      <h1>Semak Supplier</h1>
      <small>KLIKI Purchaser · ikut prioriti HQ</small>
    </div>
    <span id="status" class="pill">Data asas</span>
  </div>
</header>
<main class="wrap" id="view"></main>
<nav>
  <div class="wrap">
    <button data-tab="semak"><span class="ic">🔎</span>Semak</button>
    <button data-tab="order"><span class="ic">🧾</span>Order<span class="badge" id="badge" hidden>0</span></button>
    <button data-tab="admin"><span class="ic">🔐</span>HQ</button>
  </div>
</nav>
<script src="config.js"></script>
<script src="logic.js"></script>
<script src="models.js"></script>
<script src="app.js"></script>
</body>
</html>
